# ============================================================
# APPLICATION
# ============================================================
spring.application.name=41-DELIVERY-SERVICE-EXP2
server.port=8080

# ============================================================
# DATABASE
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/practice_db
spring.datasource.username=root
spring.datasource.password=root@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ============================================================
# KAFKA - COMMON
# ============================================================
spring.kafka.bootstrap-servers=localhost:9092

# ============================================================
# KAFKA - PRODUCER
# ============================================================
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.template.observation-enabled=true

# ============================================================
# KAFKA - CONSUMER
# ============================================================
spring.kafka.consumer.group-id=delivery-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.listener.observation-enabled=true

spring.kafka.consumer.properties.spring.json.trusted.packages=com.flipkart.delivery.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.flipkart.delivery.event.PaymentEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# ============================================================
# TRACING
# ============================================================
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=b3

# ============================================================
# LOGGING
# ============================================================
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]
