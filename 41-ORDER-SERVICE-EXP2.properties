spring.application.name=41-ORDER-SERVICE-EXP2

spring.datasource.url=jdbc:mysql://localhost:3306/practice_db
spring.datasource.username=root
spring.datasource.password=root@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Tracing
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=b3_multi
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# Feign
spring.cloud.openfeign.micrometer.enabled=true

# Debug (testing ke baad hata dena)
logging.level.io.micrometer.tracing=DEBUG
logging.level.io.github.openfeign=DEBUG
logging.level.feign=DEBUG

resilience4j.circuitbreaker.instances.paymentService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.paymentService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.paymentService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.paymentService.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.paymentService.permittedNumberOfCallsInHalfOpenState=2
