spring.application.name=41-ORDER-SERVICE-EXP2

spring.datasource.url=jdbc:mysql://localhost:3306/practice_db
spring.datasource.username=root
spring.datasource.password=root@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Kafka Broker
spring.kafka.bootstrap-servers=localhost:9092

# Producer Serializers
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
spring.cloud.openfeign.micrometer.enabled=true
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}] %logger{36} - %msg%n
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
